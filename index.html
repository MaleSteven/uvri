<!DOCTYPE html>
<html>
<head>
<title>UVRI</title>
<style>
  /* Slideshow container covers the whole viewport behind the content */
  .slideshow-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Places the slides behind all text and tables */
    margin: 0;
    padding: 0;
  }

  /* Core slide styling */
  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0; /* Hidden by default, controlled by keyframes */
    animation: crossFade 15s infinite ease-in-out;
  }

  /* 
    ANIMATION TIMING CALCULATION (Total Duration: 15s for 3 images)
    Each image gets 5s total space.
    Slide 1: starts immediately (0s delay)
    Slide 2: delays by 5s
    Slide 3: delays by 10s
  */
  .slide:nth-child(1) {
    background-image: url('images/img1.jpg');
    animation-delay: 0s;
  }
  .slide:nth-child(2) {
    background-image: url('images/img2.jpg');
    animation-delay: 5s;
  }
  .slide:nth-child(3) {
    background-image: url('images/img3.jpg');
    animation-delay: 10s;
  }

  /* 
    PURE CSS ANIMATION KEYFRAMES
    0% to 10% -> Fades in and stays visible (approx 1.5s fade + visibility)
    33% to 43% -> Fades out as the next image takes over
  */
  @keyframes crossFade {
    0% { opacity: 0; }
    10% { opacity: 1; }
    33.33% { opacity: 1; }
    43.33% { opacity: 0; }
    100% { opacity: 0; }
  }

  /* Semi-dark overlay tint to make white text pop on bright background images */
  .slideshow-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(3, 11, 43, 0.7); /* Matching your original #030b2b color with 70% opacity */
    z-index: -1;
  }

  /* Interactive Navigation Link & Radio Styling */
  .nav-links {
    display: flex; 
    gap: 25px; 
    font-size: 18px; 
    font-weight: bold;
    padding: 20px;
    position: relative;
    z-index: 10;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  /* Style the text label next to the radio button */
  .nav-item label {
    color: rgb(244, 244, 10); 
    cursor: pointer;
    transition: color 0.2s ease, text-decoration 0.2s ease;
  }

  /* Highlight effect when mouse hovers over menu item */
  .nav-item:hover label {
    color: white !important; 
    text-decoration: underline !important;
  }

  /* Main content layout container */
  .content-container {
    position: relative;
    padding: 40px;
    max-width: 1200px;
    margin: 0 auto;
    z-index: 5;
  }
</style>
</head>
<body style="margin:0; font-family: Arial; background:#030b2b; color:white;">

<!-- BACKGROUND SLIDESHOW CONTAINER -->
<div class="slideshow-container">
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
</div>

<!-- SEMI-DARK OVERLAY TINT -->
<div class="slideshow-overlay"></div>

<!-- NAVIGATION BAR -->
<div class="nav-links">
  <div class="nav-item">
    <input type="radio" id="nav1" name="nav-group" checked>
    <label for="nav1">Home</label>
  </div>
  <div class="nav-item">
    <input type="radio" id="nav2" name="nav-group">
    <label for="nav2">Research</label>
  </div>
  <div class="nav-item">
    <input type="radio" id="nav3" name="nav-group">
    <label for="nav3">About UVRI</label>
  </div>
</div>

<!-- MAIN PAGE CONTENT -->
<div class="content-container">
  <h1>Uganda Virus Research Institute (UVRI)</h1>
  <p>Welcome to the official portal. This interface features a responsive background slider transitioning smoothly using pure CSS animations.</p>
</div>

</body>
</html>
