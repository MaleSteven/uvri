<p>
 The Uganda Virus Research Institute is a country’s 
national reference laboratory for viral disease,
 supporting the Ministry of Health with surveillance,
 diagnostics, and research into arboviral diseases, viral 
 haemorrhagic fevers, HIV, and emerging pathogens.
